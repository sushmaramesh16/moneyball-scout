# Local stack: FastAPI on :8000 and Streamlit (talking to the API) on :8501.
#   docker compose up --build
# Put GEMINI_API_KEY in .env to enable AI scouting reports (optional).
services:
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - report-cache:/tmp/moneyball-reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    environment:
      SCOUT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  report-cache:
