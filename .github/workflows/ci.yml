name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-deploy.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      # data/raw is never committed, so tests marked `realdata` skip themselves. The
      # synthetic pipeline/leakage tests and the API/app tests (on the committed
      # artifacts) run. No GEMINI_API_KEY: report tests use a fake model.
      - name: Pytest
        run: pytest -q -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t moneyball-scout .
      - name: Smoke-test the API inside the image
        run: |
          docker run -d --name api -p 8000:8000 moneyball-scout \
            uvicorn src.api.main:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf "localhost:8000/undervalued?limit=3"
